services:
  postgres:
    image: postgres:17
    container_name: financialoverview-db
    environment:
      POSTGRES_DB: financialoverview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD no ficheiro .env}
    ports:
      - "5432:5432"
    volumes:
      - financialoverview_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: WebApplication1/Dockerfile
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=financialoverview;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY:?Define JWT_KEY no ficheiro .env}"
    ports:
      - "5287:5287"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    environment:
      VITE_API_URL: "http://localhost:5287"
    ports:
      - "5173:80"

volumes:
  financialoverview_data:
