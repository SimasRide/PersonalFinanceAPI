version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: financialoverview-db
    environment:
      POSTGRES_DB: financialoverview
      POSTGRES_USER: postgres
      # Usa a variável de ambiente POSTGRES_PASSWORD ou 'secret' por omissão
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - financialoverview_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: WebApplication1/Dockerfile
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Connection string usada pelo EF Core dentro do container
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=financialoverview;Username=postgres;Password=${POSTGRES_PASSWORD:-secret}"
      ASPNETCORE_URLS: "http://+:5287"
    ports:
      - "5287:5287"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    environment:
      VITE_API_URL: "http://localhost:5287"
    ports:
      - "5173:80"

volumes:
  financialoverview_data:
